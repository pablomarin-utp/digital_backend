[project]
name = "backend"
version = "0.1.0"
description = "Face Recognition API for ESP32-CAM with OpenCV and pretrained models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "scikit-learn>=1.8.0",
    "tensorflow>=2.20.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.3",
]
